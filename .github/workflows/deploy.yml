name: Deploy site

# Builds the static site and deploys to GitHub Pages. The build pulls the
# pinned collections version (.data-version) from data.quipsapp.com, so the
# quote data lives in the public `quips-collections` repo, not here.
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same steps the pull-request build runs (.github/workflows/pr-build.yml); they
      # live in one composite action so the two cannot drift apart.
      - uses: ./.github/actions/build-site

      # Not `actions/upload-pages-artifact`: since v4 it leaves out dotfiles, which
      # would drop `.well-known/apple-app-site-association` — the file iOS fetches to
      # open /save links in the app. This is that action's own packaging, minus the
      # exclusion, uploaded under the name `deploy-pages` expects.
      - name: Archive site, keeping .well-known
        run: |
          tar --dereference --hard-dereference --directory . \
            --exclude=.git --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
